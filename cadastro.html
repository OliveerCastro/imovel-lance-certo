<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Imóvel Lance Certo</title>
    <meta http-equiv="refresh" content="0; url=/login.html">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .caixa {
            background: white;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .icone { font-size: 3rem; margin-bottom: 1rem; }
        h1 { color: #1e40af; font-size: 1.3rem; margin-bottom: 0.5rem; }
        p { color: #64748b; font-size: 0.95rem; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }
        a:hover { background: #1e40af; }
    </style>
</head>
<body>
    <div class="caixa">
        <div class="icone">➡️</div>
        <h1>Estamos te direcionando...</h1>
        <p>A página de cadastro agora está junto com o acesso à sua conta.</p>
        <a href="/login.html">Ir para Login e Cadastro</a>
    </div>
</body>
</html>
